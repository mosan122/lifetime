publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  get_it: ^8.0.0
  http: ^1.2.0
  flutter_bloc: ^8.1.6
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.2
  googleapis: ^13.0.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
