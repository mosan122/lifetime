name: lifetime
description: A digital time capsule for life milestones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.5.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  get_it: ^9.2.1
  http: ^1.2.0
  flutter_bloc: ^9.1.1
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  image_picker: ^1.0.7
  image_cropper: ^12.2.1
  cached_network_image: ^3.3.1
  image: ^4.0.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.5.0
  share_plus: ^12.0.2
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.3.0
  shared_preferences: ^2.2.0
  video_thumbnail: ^0.5.6
  photo_view: ^0.15.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  flutter_typeahead: ^6.0.0
  osm_nominatim: ^4.0.1
  flutter_map: ^8.3.0
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  isar_generator: ^3.1.0+1
  plugin_platform_interface: ^2.1.8
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true